<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permainan Memori: Haiwan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background: #ecfdf5; }
        .arabic-text { font-family: 'Amiri', serif; }
        
        .memory-card {
            width: 100%;
            height: 120px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }
        .memory-card.flip { transform: rotateY(180deg); }
        .front-face, .back-face {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .front-face { background: #10b981; color: white; font-size: 2rem; }
        .back-face { background: white; transform: rotateY(180deg); border: 2px solid #34d399; flex-direction: column; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-3xl font-bold text-emerald-800 mb-2">Permainan Memori: Haiwan 🐾</h1>
        <p class="text-emerald-600 mb-6">Cari pasangan nama Arab dan sebutannya!</p>
        
        <div class="flex justify-center gap-4 mb-6">
            <p class="font-bold text-lg text-slate-700">Markah: <span id="score">0</span></p>
            <button onclick="susunKad()" class="bg-emerald-500 text-white px-4 py-1 rounded-lg hover:bg-emerald-600">Mula Semula</button>
        </div>

        <div id="gameBoard" class="grid grid-cols-4 gap-4">
            </div>
    </div>

    <script>
        // Data Haiwan Peliharaan & Liar (Sebahagian untuk demo permainan)
        const senaraiHaiwan = [
            { ar: "قِطَّ", my: "Kucing" },
            { ar: "بَقَرٌ", my: "Lembu" },
            { ar: "أَسَدٌ", my: "Singa" },
            { ar: "فِيْلٌ", my: "Gajah" },
            { ar: "أَرْنَبٌ", my: "Arnab" },
            { ar: "قِرْدٌ", my: "Monyet" }
        ];

        let kadDipilih = [];
        let padananDitemui = 0;
        let markah = 0;

        function susunKad() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            kadDipilih = [];
            padananDitemui = 0;
            markah = 0;
            document.getElementById('score').innerText = markah;

            // Gandakan data untuk buat pasangan (Satu Arab, Satu Melayu)
            let susunanPermainan = [];
            senaraiHaiwan.forEach(haiwan => {
                susunanPermainan.push({ teks: haiwan.ar, jenis: 'arab', id: haiwan.my, kelas: 'arabic-text text-3xl font-bold text-emerald-700' });
                susunanPermainan.push({ teks: haiwan.my, jenis: 'melayu', id: haiwan.my, kelas: 'text-xl font-bold text-slate-700' });
            });

            // Rawakkan susunan kad
            susunanPermainan.sort(() => 0.5 - Math.random());

            susunanPermainan.forEach(item => {
                const kad = document.createElement('div');
                kad.classList.add('memory-card');
                kad.dataset.id = item.id;
                
                kad.innerHTML = `
                    <div class="front-face">❓</div>
                    <div class="back-face ${item.kelas}">${item.teks}</div>
                `;
                
                kad.addEventListener('click', flipCard);
                gameBoard.appendChild(kad);
            });
        }

        function flipCard() {
            if (kadDipilih.length < 2 && !this.classList.contains('flip')) {
                this.classList.add('flip');
                kadDipilih.push(this);

                if (kadDipilih.length === 2) {
                    setTimeout(semakPadanan, 800);
                }
            }
        }

        function semakPadanan() {
            const [kad1, kad2] = kadDipilih;
            const padan = kad1.dataset.id === kad2.dataset.id;

            if (padan) {
                markah += 10;
                padananDitemui++;
                kadDipilih = [];
                if (padananDitemui === senaraiHaiwan.length) {
                    alert('Tahniah! Anda telah melengkapkan permainan.');
                }
            } else {
                kad1.classList.remove('flip');
                kad2.classList.remove('flip');
                kadDipilih = [];
            }
            document.getElementById('score').innerText = markah;
        }

        // Mulakan permainan apabila fail dibuka
        susunKad();
    </script>
</body>
</html>
