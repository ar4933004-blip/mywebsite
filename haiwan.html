<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus & Permainan Haiwan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background: #ecfdf5; }
        .arabic-text { font-family: 'Amiri', serif; }
        
        /* Gaya untuk Nota Flashcard */
        .nota-card { perspective: 1000px; height: 220px; }
        .nota-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .nota-card.flipped .nota-inner { transform: rotateY(180deg); }
        .nota-front, .nota-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .nota-front { background: white; border: 2px solid #a7f3d0; }
        .nota-back { background: #059669; color: white; transform: rotateY(180deg); }

        /* Gaya untuk Permainan Memori */
        .memory-card { perspective: 1000px; height: 120px; cursor: pointer; }
        .memory-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.5s; transform-style: preserve-3d; }
        .memory-card.flip .memory-inner { transform: rotateY(180deg); }
        .memory-front, .memory-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .memory-front { background: #10b981; color: white; font-size: 2.5rem; }
        .memory-back { background: white; transform: rotateY(180deg); border: 2px solid #34d399; }
    </style>
</head>
<body class="p-4 md:p-8">
    
<div style="position:fixed; top:10px; left:10px; z-index:999;">
    <button onclick="toggleMenu()" style="font-size:24px;">☰</button>
</div>

<div id="menu" style="display:none; position:fixed; top:50px; left:10px; background:white; padding:15px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); z-index:999;">
    <p><a href="index.html">🍎 Fawakih</a></p>
    <p><a href="warna.html">🎨 Warna</a></p>
    <p><a href="quiz.html">🎮 Kuiz</a></p>
    <p><a href="haiwan.html">🐾 Haiwan</a></p>
</div>
    <div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden min-h-[80vh] border-4 border-emerald-100 p-6">
        
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-emerald-800 mb-6">Dunia Haiwan 🐾</h1>
            <div class="flex justify-center gap-4">
                <button id="btnNota" onclick="bukaBahagian('nota')" class="px-6 py-3 bg-emerald-600 text-white rounded-xl font-bold transition-all hover:bg-emerald-700 shadow-md">
                    📖 Buku Nota
                </button>
                <button id="btnMain" onclick="bukaBahagian('main')" class="px-6 py-3 bg-white border-2 border-emerald-500 text-emerald-600 rounded-xl font-bold transition-all hover:bg-emerald-50 shadow-md">
                    🎮 Main Permainan
                </button>
            </div>
        </header>

        <div id="bahagianNota">
            <div class="text-center mb-6">
                <input type="text" id="carian" placeholder="Cari haiwan..." class="w-full max-w-md px-5 py-3 rounded-full border-2 border-emerald-200 outline-none focus:border-emerald-500">
            </div>
            <div id="gridNota" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                </div>
        </div>

        <div id="bahagianMain" style="display: none;" class="text-center">
            <p class="text-emerald-600 mb-4">Cari pasangan nama Arab dan sebutan Jawinya!</p>
            <div class="flex justify-center gap-4 mb-6 items-center">
                <p class="font-bold text-xl text-slate-700 bg-emerald-100 px-4 py-2 rounded-lg">Markah: <span id="score">0</span></p>
                <button onclick="mulaPermainan()" class="bg-emerald-500 text-white px-4 py-2 rounded-lg hover:bg-emerald-600 font-bold">Main Semula</button>
            </div>
            <div id="gridMemori" class="grid grid-cols-4 gap-4 max-w-3xl mx-auto">
                </div>
        </div>

    </div>

    <script>
        const senaraiHaiwanLengkap = [
            { ar: "قِطَّ", rm: "Qittun", my: "Kucing", jawi: "کوچيڠ" }, { ar: "بَقَرٌ", rm: "Baqarun", my: "Lembu", jawi: "لمبو" },
            { ar: "غَنَمٌ", rm: "Ghanamun", my: "Kambing", jawi: "کمبيڠ" }, { ar: "حِصَانٌ", rm: "Hisānun", my: "Kuda", jawi: "کودا" },
            { ar: "جَامُوسٌ", rm: "Jāmūsun", my: "Kerbau", jawi: "کرباو" }, { ar: "حِمَارٌ", rm: "Himārun", my: "Keldai", jawi: "کلداي" },
            { ar: "أَرْنَبٌ", rm: "Arnabun", my: "Arnab", jawi: "ارنب" }, { ar: "كَلْبٌ", rm: "Kalbun", my: "Anjing", jawi: "انجيڠ" },
            { ar: "جَمَلٌ", rm: "Jamalun", my: "Unta", jawi: "اونتا" }, { ar: "دَجَاجَةٌ", rm: "Dajājatun", my: "Ayam", jawi: "ايم" },
            { ar: "دِيْكٌ", rm: "Dīkun", my: "Ayam jantan", jawi: "ايم جنتن" }, { ar: "سِنْجَابٌ", rm: "Sinjābun", my: "Tupai", jawi: "توڤاي" },
            { ar: "طَيْرٌ", rm: "Tayrun", my: "Burung", jawi: "بوروڠ" }, { ar: "خَرُوفٌ", rm: "Kharūfun", my: "Biri-biri", jawi: "بيري٢" },
            { ar: "بَطَّةٌ", rm: "Battatun", my: "Itik", jawi: "ايتيق" }, { ar: "إِوَزْةٌ", rm: "Iwazzatun", my: "Angsa", jawi: "اڠسا" },
            { ar: "سُلَحْفَاةٌ", rm: "Sulahfātun", my: "Kura-kura", jawi: "کورا٢" }, { ar: "أَسَدٌ", rm: "Asadun", my: "Singa", jawi: "سيڠا" },
            { ar: "نَمِرٌ", rm: "Namirun", my: "Harimau", jawi: "هريماو" }, { ar: "تِمْسَاحٌ", rm: "Timsāhun", my: "Buaya", jawi: "بوايا" },
            { ar: "تُعْبَانٌ", rm: "Su'bānun", my: "Ular", jawi: "اولر" }, { ar: "فِيْلٌ", rm: "Filun", my: "Gajah", jawi: "ݢاجه" },
            { ar: "قِرْدٌ", rm: "Qirdun", my: "Monyet", jawi: "موڽيت" }, { ar: "زَرَافَةٌ", rm: "Zarafatun", my: "Zirafah", jawi: "زرافه" },
            { ar: "غُوْرِيْلًا", rm: "Ghūrīlā", my: "Gorila", jawi: "ݢوريلا" }, { ar: "ذِئْبٌ", rm: "Zikbun", my: "Serigala", jawi: "سريݢالا" },
            { ar: "غَزَالٌ", rm: "Ghazalun", my: "Rusa", jawi: "روسا" }, { ar: "تَعْلَبٌ", rm: "Sa'labun", my: "Musang", jawi: "موسڠ" },
            { ar: "قنفذ", rm: "Qanfuzun", my: "Landak", jawi: "لندق" }, { ar: "فَهْدٌ", rm: "Fahdun", my: "Harimau bintang", jawi: "هريماو بينتڠ" },
            { ar: "ضَبْعٌ", rm: "Dhab-'un", my: "Dubuk", jawi: "دوبوق" }, { ar: "دُبٌ", rm: "Dubbun", my: "Beruang", jawi: "برواڠ" },
            { ar: "كَرْكَذَّنٌ", rm: "Karkaddanun", my: "Badak Sumbu", jawi: "بادق سومبو" }, { ar: "فَرَسُ النَّهْرِ", rm: "Farasun nahri", my: "Badak Air", jawi: "بادق اير" },
            { ar: "أَبُو الْحُصَيْنِ", rm: "Abul husayni", my: "Kancil", jawi: "کنچيل" }, { ar: "نَاسُ الْغَابَةِ", rm: "Nāsul ghābati", my: "Orang Utan", jawi: "اورڠ اوتن" },
            { ar: "حِمَارٌ وَحْشِيٌّ", rm: "Himārun wahshiyyun", my: "Kuda Belang", jawi: "کودا بلڠ" }, { ar: "دِيْكٌ رُومِيٌّ", rm: "Dīkun rūmiyyun", my: "Ayam Belanda", jawi: "ايم بلندا" }
        ];

        /* --- FUNGSI TUKAR BAHAGIAN --- */
        function bukaBahagian(bahagian) {
            document.getElementById('bahagianNota').style.display = bahagian === 'nota' ? 'block' : 'none';
            document.getElementById('bahagianMain').style.display = bahagian === 'main' ? 'block' : 'none';
            
            const btnNota = document.getElementById('btnNota');
            const btnMain = document.getElementById('btnMain');

            if(bahagian === 'nota') {
                btnNota.className = "px-6 py-3 bg-emerald-600 text-white rounded-xl font-bold transition-all shadow-md";
                btnMain.className = "px-6 py-3 bg-white border-2 border-emerald-500 text-emerald-600 rounded-xl font-bold transition-all shadow-md";
            } else {
                btnMain.className = "px-6 py-3 bg-emerald-600 text-white rounded-xl font-bold transition-all shadow-md";
                btnNota.className = "px-6 py-3 bg-white border-2 border-emerald-500 text-emerald-600 rounded-xl font-bold transition-all shadow-md";
                mulaPermainan();
            }
        }

        /* --- FUNGSI BUKU NOTA --- */
        function paparNota(filter = "") {
            const grid = document.getElementById('gridNota');
            grid.innerHTML = "";
            senaraiHaiwanLengkap.filter(h => h.my.toLowerCase().includes(filter.toLowerCase()) || h.ar.includes(filter))
            .forEach(haiwan => {
                const kad = document.createElement('div');
                kad.className = "nota-card";
                kad.innerHTML = `
                    <div class="nota-inner" onclick="this.parentElement.classList.toggle('flipped')">
                        <div class="nota-front p-4">
                            <h2 class="arabic-text text-4xl font-bold text-emerald-700 mb-2">${haiwan.ar}</h2>
                            <p class="text-slate-400 italic text-sm mb-3">${haiwan.rm}</p>
                            <button onclick="event.stopPropagation(); speak('${haiwan.ar}')" class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold hover:bg-emerald-200">🔊 SEBUT</button>
                        </div>
                        <div class="nota-back p-4">
                            <h3 class="text-3xl font-bold arabic-text mb-2">${haiwan.jawi}</h3>
                            <p class="text-emerald-100 text-sm">${haiwan.my}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(kad);
            });
        }

        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ar-SA';
            window.speechSynthesis.speak(msg);
        }

        document.getElementById('carian').addEventListener('input', (e) => paparNota(e.target.value));
        paparNota();

        /* --- FUNGSI PERMAINAN MEMORI --- */
        let kadDipilih = [], padananDitemui = 0, markah = 0;

        function mulaPermainan() {
            const grid = document.getElementById('gridMemori');
            grid.innerHTML = '';
            kadDipilih = []; padananDitemui = 0; markah = 0;
            document.getElementById('score').innerText = markah;

            let senaraiRawak = [...senaraiHaiwanLengkap].sort(() => 0.5 - Math.random()).slice(0, 8);
            let susunanPermainan = [];
            senaraiRawak.forEach(haiwan => {
                susunanPermainan.push({ teks: haiwan.ar, id: haiwan.my, kelas: 'arabic-text text-4xl font-bold text-emerald-700' });
                susunanPermainan.push({ teks: haiwan.jawi, id: haiwan.my, kelas: 'arabic-text text-2xl font-bold text-slate-700' });
            });
            susunanPermainan.sort(() => 0.5 - Math.random());

            susunanPermainan.forEach(item => {
                const kad = document.createElement('div');
                kad.className = 'memory-card';
                kad.dataset.id = item.id;
                kad.innerHTML = `
                    <div class="memory-inner">
                        <div class="memory-front">❓</div>
                        <div class="memory-back p-2 ${item.kelas}">${item.teks}</div>
                    </div>
                `;
                kad.addEventListener('click', function() {
                    if (kadDipilih.length < 2 && !this.classList.contains('flip')) {
                        this.classList.add('flip');
                        kadDipilih.push(this);
                        if (kadDipilih.length === 2) setTimeout(semakPadanan, 800);
                    }
                });
                grid.appendChild(kad);
            });
        }

        function semakPadanan() {
            const [kad1, kad2] = kadDipilih;
            if (kad1.dataset.id === kad2.dataset.id) {
                markah += 10; padananDitemui++;
                if (padananDitemui === 8) alert('Hebat! Anda berjaya padankan semua haiwan.');
            } else {
                kad1.classList.remove('flip');
                kad2.classList.remove('flip');
            }
            kadDipilih = [];
            document.getElementById('score').innerText = markah;
        }
    </script>
    <script>
function toggleMenu() {
    const menu = document.getElementById('menu');
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}
</script>
</body>
</html>
