<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Arab: Al-Fawakihu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background: #f0f9ff; }
        .arabic-text { font-family: 'Amiri', serif; }
        
        /* Kesan Pusing (Flip) */
        .flip-card { background-color: transparent; perspective: 1000px; height: 250px; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .flip-card-front { background-color: white; border: 2px solid #e2e8f0; }
        .flip-card-back { background-color: #0ea5e9; color: white; transform: rotateY(180deg); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-sky-900 mb-2">🍎 Flashcard Al-Fawākihu</h1>
            <p class="text-sky-600">Klik pada kad untuk melihat maksud dan sebutan</p>
            
            <div class="mt-6 max-w-md mx-auto">
                <input type="text" id="searchInput" placeholder="Cari nama buah (cth: Pisang)..." 
                class="w-full px-5 py-3 rounded-full border-2 border-sky-200 focus:border-sky-500 outline-none shadow-sm">
            </div>
        </header>

        <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            </div>
    </div>

    <script>
        const fruits = [
            { ar: "مَوْزٌ", rm: "Mawzun", my: "Pisang", en: "Banana", emoji: "🍌" },
            { ar: "مَانُجُو", rm: "Manjū", my: "Mangga", en: "Mango", emoji: "🥭" },
            { ar: "عِنَبٌ", rm: "Inabun", my: "Anggur", en: "Grape", emoji: "🍇" },
            { ar: "تُفَّاحٌ", rm: "Tuffāhun", my: "Epal", en: "Apple", emoji: "🍎" },
            { ar: "بَابَايَا", rm: "Bābāyā", my: "Betik", en: "Papaya", emoji: " papaya" },
            { ar: "أَنَانَاسٌ", rm: "Anānāsun", my: "Nenas", en: "Pineapple", emoji: "🍍" },
            { ar: "بُرْتُقَالٌ", rm: "Burtuqālun", my: "Oren/Limau", en: "Orange", emoji: "🍊" },
            { ar: "رَمْبُوتَنٌ", rm: "Rambūtanun", my: "Rambutan", en: "Rambutan", emoji: "🔴" },
            { ar: "بِطَّيْخٌ", rm: "Bittikhun", my: "Tembikai", en: "Watermelon", emoji: "🍉" },
            { ar: "فَرَوْلَةٌ", rm: "Farawlatun", my: "Strawberi", en: "Strawberry", emoji: "🍓" },
            { ar: "أَبُو شَوْكَةٍ", rm: "Abū syaukatin", my: "Durian", en: "Durian", emoji: "🍈" },
            { ar: "ثَمْبِدَقٌ", rm: "Sambidaqun", my: "Cempedak", en: "Cempedak", emoji: "🥖" },
            { ar: "مَانْجِسْتَانِ", rm: "Manjistān", my: "Manggis", en: "Mangosteen", emoji: "🟣" },
            { ar: "زُعْرُورٌ", rm: "Zu'rūrun", my: "Ciku", en: "Chiku", emoji: "🥔" },
            { ar: "جَوَّافَةٌ", rm: "Jawwāfatun", my: "Jambu Batu", en: "Guava", emoji: "🍏" },
            { ar: "نَجْمِيَّةٌ", rm: "Najmiyyatun", my: "Belimbing", en: "Starfruit", emoji: "⭐" },
            { ar: "لَنجْسَات", rm: "Lanjsāt", my: "Langsat", en: "Langsat", emoji: "🟡" },
            { ar: "تَشِيَّةٌ", rm: "Tashiyyatun", my: "Laici", en: "Lychee", emoji: "🍒" },
            { ar: "نَانْجِكَا", rm: "Nanjkā", my: "Nangka", en: "Jackfruit", emoji: "🍈" },
            { ar: "كُمِثْرَى", rm: "Kumisrā", my: "Lai", en: "Pear", emoji: "🍐" },
            { ar: "رُمَّانٌ", rm: "Rummānun", my: "Delima", en: "Pomegranate", emoji: "🍷" },
            { ar: "نَارَجِيْلٌ", rm: "Nārajīlun", my: "Kelapa", en: "Coconut", emoji: "🥥" },
            { ar: "كَرَزٌ", rm: "Karazun", my: "Ceri", en: "Cherry", emoji: "🍒" },
            { ar: "كِيْوِي", rm: "Kīwī", my: "Kiwi", en: "Kiwi", emoji: "🥝" },
            { ar: "دُرَّاقٌ", rm: "Durrāqun", my: "Pic", en: "Peach", emoji: "🍑" },
            { ar: "تَمْرٌ", rm: "Tamrun", my: "Kurma", en: "Dates", emoji: "🌴" },
            { ar: "زَبِيْبٌ", rm: "Zabībun", my: "Kismis", en: "Raisin", emoji: "🍇" },
            { ar: "لِيْمُونٌ", rm: "Līmūnun", my: "Lemon", en: "Lemon", emoji: "🍋" },
            { ar: "مَاتَ كُوْجِيْنْ", rm: "Māta kūjīnj", my: "Mata Kucing", en: "Longan", emoji: "👁️" },
            { ar: "دُورِيَانٌ بُلَنْدَى", rm: "Dūriyānun bulandā", my: "Durian Belanda", en: "Soursop", emoji: "🍏" }
        ];

        function renderCards(filter = "") {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = "";
            
            fruits.filter(f => f.my.toLowerCase().includes(filter.toLowerCase()) || f.ar.includes(filter))
            .forEach(fruit => {
                const card = document.createElement('div');
                card.className = "flip-card";
                card.innerHTML = `
                    <div class="flip-card-inner" onclick="this.parentElement.classList.toggle('flipped')">
                        <div class="flip-card-front">
                            <span class="text-4xl mb-4">${fruit.emoji}</span>
                            <h2 class="text-4xl arabic-text text-sky-700 mb-2">${fruit.ar}</h2>
                            <p class="text-gray-400 italic">${fruit.rm}</p>
                            <button onclick="event.stopPropagation(); speak('${fruit.ar}')" class="mt-4 p-2 bg-sky-100 rounded-full hover:bg-sky-200">
                                🔊 Bunyi
                            </button>
                        </div>
                        <div class="flip-card-back">
                            <h3 class="text-2xl font-bold">${fruit.my}</h3>
                            <p class="opacity-80">${fruit.en}</p>
                            <p class="mt-4 text-sm font-light">Klik untuk pusing semula</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function speak(text) {
            const msg = new SpeechSynthesisUtterance();
            msg.text = text;
            msg.lang = 'ar-SA';
            window.speechSynthesis.speak(msg);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => renderCards(e.target.value));
        renderCards();
    </script>
</body>
</html>
