<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuiz Game Buah</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Quicksand', sans-serif;
    text-align: center;
    background: #f0f9ff;
    padding: 20px;
}

.arabic {
    font-family: 'Amiri', serif;
    direction: rtl;
    font-size: 2rem;
}

button {
    margin: 8px;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: #0ea5e9;
    color: white;
    cursor: pointer;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<h1>🎮 Kuiz Buah</h1>

<div id="menu">
    <h2>Pilih Tahap</h2>
    <button onclick="startGame('easy')">🟢 Mudah</button>
    <button onclick="startGame('medium')">🟡 Sederhana</button>
    <button onclick="startGame('hard')">🔴 Susah</button>
</div>

<div id="game" style="display:none;">
    <p>Skor: <span id="score">0</span></p>
    <h2 id="question"></h2>
    <div id="answers"></div>
    <input id="inputAnswer" style="display:none;" placeholder="Taip jawapan...">
    <button id="submitBtn" style="display:none;" onclick="submitAnswer()">Hantar</button>
    <p id="result"></p>
    <button onclick="nextQuestion()">➡️ Seterusnya</button>
</div>

<a href="index.html">⬅️ Flashcard</a>

<script>
const fruits = [
{ ar:"مَوْزٌ", my:"ڤيسڠ" },
{ ar:"مَانْجُو", my:"مڠݢ" },
{ ar:"عِنَبٌ", my:"اڠݢور" },
{ ar:"تُفَّاحٌ", my:"ايڤل" },
{ ar:"بَابَايَا", my:"بتيق" },
{ ar:"أَنَانَاسٌ", my:"ننس" },
{ ar:"بُرْتُقَالٌ", my:"اورين" },
{ ar:"رَمْبُوتَنٌ", my:"رمبوتن" },
{ ar:"بِطَّيْخٌ", my:"تمبيکاي" },
{ ar:"فَرَوْلَةٌ", my:"ستروبيري" },
{ ar:"أَبُو شَوْكَةٍ", my:"دورين" },
{ ar:"ثَمْبِدَقٌ", my:"چمڤدق" },
{ ar:"مَانْجِسْتَانِ", my:"مڠݢيس" },
{ ar:"زُعْرُورٌ", my:"چيكو" },
{ ar:"جَوَّافَةٌ", my:"جمبو" },
{ ar:"نَجْمِيَّةٌ", my:"بليمبيڠ" },
{ ar:"لَنجْسَات", my:"لڠسات" },
{ ar:"تَشِيَّةٌ", my:"لايچي" },
{ ar:"نَانْجِكَا", my:"نڠكا" },
{ ar:"كُمِثْرَى", my:"لاي" },
{ ar:"رُمَّانٌ", my:"دليما" },
{ ar:"نَارَجِيْلٌ", my:"کلاڤا" },
{ ar:"كَرَزٌ", my:"چري" },
{ ar:"كِيْوِي", my:"کيوي" },
{ ar:"دُرَّاقٌ", my:"ڤيچ" },
{ ar:"تَمْرٌ", my:"کورما" },
{ ar:"زَبِيْبٌ", my:"کيسميس" },
{ ar:"لِيْمُونٌ", my:"ليمون" },
{ ar:"مَاتَ كُوْجِيْنْ", my:"مات کوچيڠ" },
{ ar:"دُورِيَانٌ بُلَنْدَى", my:"دورين بلندا" }
];

let level = "easy";
let current;
let score = 0;

function startGame(lv) {
    level = lv;
    score = 0;
    document.getElementById('menu').style.display = "none";
    document.getElementById('game').style.display = "block";
    nextQuestion();
}

function nextQuestion() {
    document.getElementById('result').innerHTML = "";
    current = fruits[Math.floor(Math.random()*fruits.length)];

    const q = document.getElementById('question');
    const answers = document.getElementById('answers');
    const input = document.getElementById('inputAnswer');
    const submit = document.getElementById('submitBtn');

    answers.innerHTML = "";
    input.style.display = "none";
    submit.style.display = "none";

    if (level === "easy") {
        q.innerHTML = `<span class="arabic">${current.ar}</span>`;

        let options = [current.my];
        while(options.length < 4){
            let r = fruits[Math.floor(Math.random()*fruits.length)].my;
            if(!options.includes(r)) options.push(r);
        }

        options.sort(()=>Math.random()-0.5);

        options.forEach(opt=>{
            let btn=document.createElement("button");
            btn.innerHTML=opt;
            btn.onclick=()=>check(opt);
            answers.appendChild(btn);
        });

    } else if (level === "medium") {
        q.innerHTML = current.my;

        let options = [current.ar];
        while(options.length < 4){
            let r = fruits[Math.floor(Math.random()*fruits.length)].ar;
            if(!options.includes(r)) options.push(r);
        }

        options.sort(()=>Math.random()-0.5);

        options.forEach(opt=>{
            let btn=document.createElement("button");
            btn.innerHTML=`<span class="arabic">${opt}</span>`;
            btn.onclick=()=>check(opt);
            answers.appendChild(btn);
        });

    } else {
        q.innerHTML = `<span class="arabic">${current.ar}</span>`;
        input.style.display = "block";
        submit.style.display = "inline-block";
        input.value="";
    }
}

function check(ans){
    if(ans === (level==="medium"? current.ar: current.my)){
        score+=10;
        document.getElementById('result').innerHTML="✅ Betul!";
    } else {
        document.getElementById('result').innerHTML="❌ Salah!";
    }
    document.getElementById('score').innerHTML=score;
}

function submitAnswer(){
    const val = document.getElementById('inputAnswer').value.trim();
    if(val === current.my){
        score+=15;
        document.getElementById('result').innerHTML="🔥 Tepat!";
    } else {
        document.getElementById('result').innerHTML="❌ Salah!";
    }
    document.getElementById('score').innerHTML=score;
}
</script>

    <script>
function toggleMenu() {
    const menu = document.getElementById('menu');
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}
</script>
</body>
<div style="position:fixed; top:10px; left:10px; z-index:999;">
    <button onclick="toggleMenu()" style="font-size:24px;">☰</button>
</div>

<div id="menu" style="display:none; position:fixed; top:50px; left:10px; background:white; padding:15px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); z-index:999;">
    <p><a href="index.html">🍎 Fawakih</a></p>
    <p><a href="warna.html">🎨 Warna</a></p>
    <p><a href="quiz.html">🎮 Kuiz</a></p>
</div>    
</html>
