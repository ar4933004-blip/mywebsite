<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuiz Game Buah</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Quicksand', sans-serif;
    text-align: center;
    background: #f0f9ff;
    padding: 20px;
}

.arabic {
    font-family: 'Amiri', serif;
    font-size: 2.5rem;
    direction: rtl;
}

button {
    display: block;
    margin: 10px auto;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: #0ea5e9;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0284c7;
}

#timer {
    font-size: 1.5rem;
    color: red;
}
</style>
</head>

<body>

<h1>🎮 Kuiz Game Buah</h1>

<p>⏱️ Masa: <span id="timer">10</span>s</p>
<p>⭐ Skor: <span id="score">0</span> | 🔥 Streak: <span id="streak">0</span></p>

<h2 id="question" class="arabic"></h2>

<div id="answers"></div>

<p id="result"></p>

<button onclick="startGame()">🔄 Mula Semula</button>
<a href="index.html">⬅️ Flashcard</a>

<script>
const fruits = [
{ ar: "مَوْزٌ", my: "ڤيسڠ" },
{ ar: "مَانْجُو", my: "مڠݢ" },
{ ar: "عِنَبٌ", my: "اڠݢور" },
{ ar: "تُفَّاحٌ", my: "ايڤل" },
{ ar: "أَنَانَاسٌ", my: "ننس" },
{ ar: "بُرْتُقَالٌ", my: "اورين" },
{ ar: "رَمْبُوتَنٌ", my: "رمبوتن" },
{ ar: "بِطَّيْخٌ", my: "تمبيکاي" },
{ ar: "فَرَوْلَةٌ", my: "ستروبيري" },
{ ar: "تَمْرٌ", my: "کورما" }
];

let questions = [];
let current;
let score = 0;
let streak = 0;
let timer;
let timeLeft = 10;

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function startGame() {
    score = 0;
    streak = 0;
    questions = shuffle([...fruits]);
    nextQuestion();
}

function nextQuestion() {
    clearInterval(timer);
    timeLeft = 10;
    document.getElementById('timer').innerHTML = timeLeft;
    document.getElementById('result').innerHTML = "";

    if (questions.length === 0) {
        endGame();
        return;
    }

    current = questions.pop();
    document.getElementById('question').innerHTML = current.ar;

    let options = [current.my];
    while (options.length < 4) {
        let rand = fruits[Math.floor(Math.random() * fruits.length)].my;
        if (!options.includes(rand)) options.push(rand);
    }

    options = shuffle(options);

    const answersDiv = document.getElementById('answers');
    answersDiv.innerHTML = "";

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.innerHTML = opt;

        btn.onclick = () => checkAnswer(opt);

        answersDiv.appendChild(btn);
    });

    timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerHTML = timeLeft;

        if (timeLeft === 0) {
            clearInterval(timer);
            streak = 0;
            document.getElementById('result').innerHTML = "⏰ Masa habis!";
            setTimeout(nextQuestion, 1000);
        }
    }, 1000);
}

function checkAnswer(answer) {
    clearInterval(timer);

    if (answer === current.my) {
        score += 10;
        streak++;
        document.getElementById('result').innerHTML = "✅ Betul!";
        playSound(true);
    } else {
        streak = 0;
        document.getElementById('result').innerHTML = "❌ Salah!";
        playSound(false);
    }

    document.getElementById('score').innerHTML = score;
    document.getElementById('streak').innerHTML = streak;

    setTimeout(nextQuestion, 1000);
}

function playSound(correct) {
    const audio = new Audio(correct
        ? "https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"
        : "https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"
    );
    audio.play();
}

function endGame() {
    document.getElementById('question').innerHTML = "🎉 Tamat!";
    document.getElementById('answers').innerHTML = "";
    document.getElementById('result').innerHTML = "Skor akhir: " + score;

    if (score >= 80) {
        document.getElementById('result').innerHTML += "<br>🌟 Hebat!";
    } else if (score >= 50) {
        document.getElementById('result').innerHTML += "<br>👍 Bagus!";
    } else {
        document.getElementById('result').innerHTML += "<br>💪 Cuba lagi!";
    }
}

startGame();
</script>

</body>
</html>
